<!-- Firebase Script with Instant Local Caching -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXycN3dBMmSO2n3Dc2vQDmK_mOO3XJ22M",
      authDomain: "nk-accounts.firebaseapp.com",
      databaseURL: "https://nk-accounts-default-rtdb.firebaseio.com",
      projectId: "nk-accounts",
      storageBucket: "nk-accounts.firebasestorage.app",
      messagingSenderId: "647793698356",
      appId: "1:647793698356:web:3ee8a12ab0265f125b0c61",
      measurementId: "G-BKPP3B4LVB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    let rawListings = [];
    let selectedCategory = "all";

    const listingsGrid = document.getElementById("listingsGrid");
    const categoriesGrid = document.getElementById("categoriesGrid");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const noResults = document.getElementById("noResults");
    const hamburger = document.getElementById("hamburger");
    const navLinks = document.getElementById("navLinks");
    const navAuthContainer = document.getElementById("navAuthContainer");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalBody = document.getElementById("modalBody");
    const modalClose = document.getElementById("modalClose");

    // Dynamic Auth State Check for Navbar
    onAuthStateChanged(auth, (user) => {
      if (user) {
        navAuthContainer.innerHTML = `
          <span class="user-status">${user.email.split('@')[0]}</span>
          <button id="navLogoutBtn" class="btn btn-outline" style="padding: 4px 10px; font-size: 0.8rem;">Logout</button>
        `;
        document.getElementById("navLogoutBtn").addEventListener("click", () => signOut(auth));
      } else {
        navAuthContainer.innerHTML = `
          <a href="contact.html?mode=login" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.85rem; text-decoration: none;">Login</a>
          <a href="contact.html?mode=signup" class="btn btn-primary" style="padding: 6px 14px; font-size: 0.85rem; text-decoration: none;">Sign Up</a>
        `;
      }
    });

    // Hamburger Menu
    if (hamburger && navLinks) {
      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("open");
        navLinks.classList.toggle("open");
      });
    }

    // 1. කලින් සේව් වුණු ඩේටා තියෙනවා නම් එක පාරටම පෙන්වීම (Instant Load)
    const cachedData = localStorage.getItem("nk_cached_listings");
    if (cachedData) {
      try {
        rawListings = JSON.parse(cachedData);
        setupCategories();
        renderListings();
      } catch (e) {
        console.log("Cache error", e);
      }
    }

    // 2. Firebase එකෙන් අලුත්ම ඩේටා ගෙනැවිත් Update කිරීම
    const listingsRef = ref(database, 'listings');
    onValue(listingsRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        rawListings = [];
      } else {
        rawListings = Object.keys(data).map(key => ({ id: key, ...data[key] }));
      }
      
      // ඊළඟ පාර වේගයෙන් ලෝඩ් වෙන්න Cache එකට දාලා තබාගැනීම
      localStorage.setItem("nk_cached_listings", JSON.stringify(rawListings));
      
      setupCategories();
      renderListings();
    });

    // Categories setup - Only 'ALL' button enabled
    function setupCategories() {
      if (categoriesGrid) {
        categoriesGrid.innerHTML = `<button class="category-btn active" data-category="all">ALL</button>`;
      }
    }

    // Render & Filter Listings
    function renderListings() {
      let filtered = [...rawListings];

      if (selectedCategory !== "all") {
        filtered = filtered.filter(item => item.category && item.category.toLowerCase() === selectedCategory.toLowerCase());
      }

      const searchVal = searchInput.value.toLowerCase().trim();
      if (searchVal) {
        filtered = filtered.filter(item => 
          (item.title && item.title.toLowerCase().includes(searchVal)) ||
          (item.category && item.category.toLowerCase().includes(searchVal)) ||
          (item.refId && item.refId.toLowerCase().includes(searchVal)) ||
          (item.description && item.description.toLowerCase().includes(searchVal))
        );
      }

      const sortVal = sortSelect.value;
      if (sortVal === "price-asc") filtered.sort((a, b) => Number(a.price) - Number(b.price));
      if (sortVal === "price-desc") filtered.sort((a, b) => Number(b.price) - Number(a.price));
      if (sortVal === "title-asc") filtered.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
      if (sortVal === "title-desc") filtered.sort((a, b) => (b.title || "").localeCompare(a.title || ""));

      if (filtered.length === 0) {
        listingsGrid.innerHTML = "";
        noResults.hidden = false;
      } else {
        noResults.hidden = true;
        listingsGrid.innerHTML = filtered.map(item => `
          <div class="card listing-card" style="background:#12121a; border:1px solid #1f1f2e; padding:20px; border-radius:12px; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span class="badge" style="background:#1a1a26; color:#00f2fe; padding:4px 8px; border-radius:4px; font-size:0.8rem;">${item.category || 'Digital'}</span>
                <span style="color:#8a8a9e; font-size:0.85rem;">${item.refId || ''}</span>
              </div>
              <h3 style="color:#fff; font-size:1.2rem; margin-bottom:8px;">${item.title}</h3>
              <p style="color:#a0a0b2; font-size:0.9rem; margin-bottom:15px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">${item.description}</p>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid #1f1f2e; padding-top:10px;">
              <div style="font-size:1.3rem; font-weight:700; color:#00f2fe;">$${item.price}</div>
              <button class="btn btn-primary view-details-btn" data-id="${item.id}" style="padding:6px 16px;">View Details</button>
            </div>
          </div>
        `).join('');
      }
    }

    // Open Modal with Full Details
    function openModal(id) {
      const item = rawListings.find(l => l.id === id);
      if (!item) return;

      modalBody.innerHTML = `
        <div style="font-size: 2rem; text-align: center; margin-bottom: 10px;">🛍️</div>
        <p style="color: #00f2fe; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin-bottom: 5px;">${item.category || 'Digital'}</p>
        <h2 style="color: #fff; font-size: 1.4rem; margin-bottom: 10px;">${item.title}</h2>
        <p style="color: #00f2fe; font-size: 1.3rem; font-weight: 700; margin-bottom: 15px;">$${item.price}</p>
        <p style="color: #d1d1e0; font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px;">${item.description}</p>
        <p style="color: #8a8a9e; font-size: 0.85rem; margin-bottom: 20px;">Reference ID: <strong style="color: #fff;">${item.refId || ''}</strong></p>
        <a href="contact.html?ref=${item.refId || ''}" class="btn btn-primary" style="display: block; text-align: center; text-decoration: none; padding: 10px;">Inquire About This Listing</a>
      `;

      modalOverlay.hidden = false;
      requestAnimationFrame(() => modalOverlay.classList.add("open"));
      document.body.style.overflow = "hidden";
    }

    // Close Modal
    function closeModal() {
      if (!modalOverlay) return;
      modalOverlay.classList.remove("open");
      setTimeout(() => {
        modalOverlay.hidden = true;
        document.body.style.overflow = "";
      }, 300);
    }

    if (modalClose) modalClose.addEventListener("click", closeModal);
    if (modalOverlay) {
      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeModal();
      });
    }

    // Click event for View Details buttons
    if (listingsGrid) {
      listingsGrid.addEventListener("click", (e) => {
        const btn = e.target.closest(".view-details-btn");
        if (btn) {
          openModal(btn.dataset.id);
        }
      });
    }

    searchInput.addEventListener("input", renderListings);
    sortSelect.addEventListener("change", renderListings);
  </script>
